name = "cybermeters-network-probe"
main = "src/index.js"
compatibility_date = "2026-10-09"
compatibility_flags = ["enable_request_signal"]
workers_dev = false
preview_urls = false

# Private service only; two fixed Durable Object slots bound concurrency.
# Cloudflare's managed Linux image avoids a separate VPS or image registry.
[[containers]]
class_name = "NetworkProbeContainer"
scheduling_policy = "durable_object"

# The compiled TLS engines are available only when a TLS slice starts. Other
# probe routes continue to use the Cloudflare-managed image.
[containers.images.tls]
dockerfile = "./tls-engine/Dockerfile"
build_context = "../.."

[[durable_objects.bindings]]
name = "PROBE_CONTAINERS"
class_name = "NetworkProbeContainer"

[exports.NetworkProbeContainer]
type = "durable-object"
storage = "sqlite"
