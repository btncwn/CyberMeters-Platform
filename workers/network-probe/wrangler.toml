name = "cybermeters-network-probe"
main = "src/index.js"
compatibility_date = "2026-10-09"
compatibility_flags = ["enable_request_signal"]
workers_dev = false
preview_urls = false

# Workers Logs, Traces and Issues (P1-SCAN-STALL, 22 Oct 2026). The founder
# enabled them in the dashboard; this block keeps them across every `wrangler
# deploy`, which would otherwise reset dashboard-only settings. 100% sampling
# while volume is low. Limits are the account plan's, not this file's (published
# figures at the time of writing: Free 200,000 log events/day kept 3 days; Paid
# 20 M events/month included, kept 7 days); lower head_sampling_rate before
# volume nears them. Logs carry only what the code already logs: sanitised codes
# and ids, never secrets or customer content.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
persist = true

[observability.traces]
enabled = true
persist = true

[observability.issues]
enabled = true

# Private service only; two fixed Durable Object slots bound concurrency.
# Cloudflare's managed Linux image avoids a separate VPS or image registry.
[[containers]]
class_name = "NetworkProbeContainer"
scheduling_policy = "durable_object"

# The compiled TLS engines are available only when a TLS slice starts. Other
# probe routes continue to use the Cloudflare-managed image.
[containers.images.tls]
dockerfile = "./tls-engine/Dockerfile"
build_context = "../.."

[[durable_objects.bindings]]
name = "PROBE_CONTAINERS"
class_name = "NetworkProbeContainer"

[exports.NetworkProbeContainer]
type = "durable-object"
storage = "sqlite"
