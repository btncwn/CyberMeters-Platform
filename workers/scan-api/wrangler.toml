name = "cybermeters-platform"
main = "src/index.js"
compatibility_date = "2026-06-18"

[[d1_databases]]
binding = "cybermeters_db"
database_name = "cybermeters-db"
database_id = "fd6792cb-441a-44a7-8ca2-9a0b411ec706"

[[r2_buckets]]
binding = "cybermeters_reports"
bucket_name = "cybermeters-reports"

# Exposes the current deployment's version id/tag to the Worker at runtime.
# Surfaced by GET /health as deployment_id for release traceability.
[version_metadata]
binding = "CF_VERSION_METADATA"

# Observability metrics sink (Workers Analytics Engine). recordMetric() writes
# data points here (fail-open); query via the CF GraphQL/SQL Analytics API.
# Analytics Engine is enabled on the account and the cybermeters_metrics dataset
# exists. If ever disabled, comment these three lines out — recordMetric() then
# becomes a silent no-op and the Worker keeps serving normally.
[[analytics_engine_datasets]]
binding = "METRICS"
dataset = "cybermeters_metrics"

[triggers]
crons = ["0 * * * *"]

# Alert email recipients and sender.
# RESEND_API_KEY must be set as a Wrangler secret (never committed):
#   wrangler secret put RESEND_API_KEY
[vars]
# Human-readable release version, surfaced by GET /health. Bump on each
# production release (date-based: YYYY.MM.DD).
APP_VERSION = "2026.07.12"
# Planned-maintenance switch. "off" = normal. Set to "on" and redeploy to return
# a clean 503 for every API route (except /health + /ready); flip back to "off"
# and redeploy to lift. See docs/07-RELEASE-CHECKLIST.md → Maintenance mode.
MAINTENANCE_MODE = "off"
ALERT_EMAIL_TO   = "ttrnn47@gmail.com"
ALERT_EMAIL_FROM = "alerts@cybermeters.com"
SAFE_EMAIL_FROM = "safe@cybermeters.com"
HELLO_EMAIL_FROM = "hello@cybermeters.com"
ALLOWED_ORIGIN = "https://app.cybermeters.com"

# Domain that receives inbound DMARC aggregate (RUA) reports by email. Customers
# add rua=mailto:<address_local>@<RUA_INBOUND_DOMAIN>. Use exact per-address Email
# Routing rules to this Worker's email() handler; never enable zone catch-all.
RUA_INBOUND_DOMAIN = "reports.cybermeters.com"

# Exact-route automation configuration (optional and non-blocking):
#   wrangler secret put CLOUDFLARE_API_TOKEN
#   wrangler secret put CLOUDFLARE_ZONE_ID
# The token requires Cloudflare Email Routing Rules Write on the zone. The API is
# zone-scoped, so CLOUDFLARE_ACCOUNT_ID is accepted by the Worker environment but
# is not required by this adapter. Optional worker override:
# CLOUDFLARE_EMAIL_ROUTING_WORKER_NAME = "cybermeters-platform"

FRONTEND_URL = "https://app.cybermeters.com"
MICROSOFT_REDIRECT_URI = "https://cybermeters-platform.ttrnn47.workers.dev/api/auth/microsoft/callback"
