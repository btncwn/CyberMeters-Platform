name = "cybermeters-platform"
main = "src/worker.js"
compatibility_date = "2026-06-18"
compatibility_flags = ["global_fetch_strictly_public"]

# Canonical production API host. This is the ONE place the deployment declares
# where the API lives, and `validate-frontend-env-contract.js` derives the host
# every document must use from THIS value — not from a hardcoded string.
#
# Why it exists: README, frontend/.env.example, OPERATIONS.md and openapi.json all
# documented `api.cybermeters.com` while no such DNS record existed (NXDOMAIN) and
# no route or custom domain had ever been configured. Production served only from
# `cybermeters-platform.ttrnn47.workers.dev`, so a developer copying the documented
# base got a host that does not resolve, and the incident runbook's health check
# read as an outage. The env-contract validator was green throughout because it
# asserted the base's SHAPE (ends in /api) and never that the host existed.
#
# `custom_domain = true` makes Cloudflare own the DNS record and the certificate
# for this hostname — no CNAME chain, no second proxy hop, no manual TLS.
#
# The workers.dev developer hostname is RETIRED for production (10 Oct 2026).
# `api.cybermeters.com` is the only host that serves this Worker: the frontend,
# Microsoft SSO redirect, Stripe webhook and ops health checks all use it, and
# rollback is `wrangler versions deploy <id>` on that same custom domain. The
# value is written explicitly (never left to wrangler's default) so a future
# deploy cannot silently flip the hostname either way; the env-contract and
# queue-dispatch validators assert this exact line.
workers_dev = false

# Explicit Workers Paid default, separate from the legacy admission estimate.
# This setting does not grant Paid entitlement; verify actual runtime capacity.
[limits]
subrequests = 10_000

[[routes]]
pattern = "api.cybermeters.com"
custom_domain = true

[[d1_databases]]
binding = "cybermeters_db"
database_name = "cybermeters-db"
database_id = "fd6792cb-441a-44a7-8ca2-9a0b411ec706"

[[r2_buckets]]
binding = "cybermeters_reports"
bucket_name = "cybermeters-reports"

# Exposes the current deployment's version id/tag to the Worker at runtime.
# Surfaced by GET /health as deployment_id for release traceability.
[version_metadata]
binding = "CF_VERSION_METADATA"

# Observability metrics sink (Workers Analytics Engine). recordMetric() writes
# data points here (fail-open); query via the CF GraphQL/SQL Analytics API.
# Analytics Engine is enabled on the account and the cybermeters_metrics dataset
# exists. If ever disabled, comment these three lines out — recordMetric() then
# becomes a silent no-op and the Worker keeps serving normally.
[[analytics_engine_datasets]]
binding = "METRICS"
dataset = "cybermeters_metrics"

[triggers]
crons = ["0 * * * *"]

# ── Durable manual-scan dispatch (PR-3A, 22 Jul 2026) ──
# Producer binding + consumer attachment for the manual-scan Queue lifecycle
# (engines/scan-dispatch.js). INERT until SCAN_DISPATCH_MODE (below) is flipped
# to "queue" (PR-3B cutover, founder-gated): at "waituntil" the producer never
# sends, so the consumer receives nothing.
#
# BOTH queues must exist BEFORE the first deploy of this config (deploy fails
# otherwise; `wrangler deploy --dry-run` in CI does not require them):
#   wrangler queues create cybermeters-scan-dispatch
#   wrangler queues create cybermeters-scan-dlq
#
# max_batch_size = 1: one scan = one consumer invocation = a full invocation
# subrequest budget per scan (never shared, unlike the cron tick).
# The DLQ deliberately has NO consumer: a dead-lettered scan's row is a stale
# 'queued'/'running' the hourly PR-1 recovery path converges to an honest
# 'failed' (engines/scan-recovery.js).
[[queues.producers]]
binding = "SCAN_QUEUE"
queue = "cybermeters-scan-dispatch"

[[queues.consumers]]
queue = "cybermeters-scan-dispatch"
max_batch_size = 1
max_retries = 3
max_concurrency = 2
dead_letter_queue = "cybermeters-scan-dlq"

# F-027: the scan DLQ now has a DISTINCT consumer (the ops observer in
# index.js queue handler, dispatched by queue identity). It persists a safe
# operational event per dead-lettered scan and NEVER runs the scan engine.
# No dead_letter_queue here: a failed observe no-acks and redelivers on the
# same DLQ (idempotent), it does not cascade to a further queue.
[[queues.consumers]]
queue = "cybermeters-scan-dlq"
max_batch_size = 10
max_retries = 5

# Alert email recipients and sender.
# RESEND_API_KEY must be set as a Wrangler secret (never committed):
#   wrangler secret put RESEND_API_KEY
[vars]
# Human-readable release version, surfaced by GET /health. Bump on each
# production release (date-based: YYYY.MM.DD).
APP_VERSION = "2026.10.10-lynceus-posture.a34a2471a6bf"
# DNS_PROVIDER_KEY is a dedicated versioned encryption key ring, staged as a
# Worker secret. Never put its value here or reuse an authentication key.
# Planned-maintenance switch. "off" = normal. Set to "on" and redeploy to return
# a clean 503 for every API route (except /health + /ready); flip back to "off"
# and redeploy to lift. See docs/07-RELEASE-CHECKLIST.md → Maintenance mode.
MAINTENANCE_MODE = "off"
# First-customer recovery stays within Cloudflare (Founder, 2026-10-08).
# Independent backup monitoring is optional; this does not claim a backup ran.
# Only exact "off" exempts its freshness from the deadman. "on" enables it;
# absent/unrecognized values keep the freshness requirement.
INDEPENDENT_BACKUP_MONITORING = "off"
ALERT_EMAIL_TO   = "ttrnn47@gmail.com"
ALERT_EMAIL_FROM = "alerts@cybermeters.com"
SAFE_EMAIL_FROM = "safe@cybermeters.com"
HELLO_EMAIL_FROM = "hello@cybermeters.com"
ALLOWED_ORIGIN = "https://app.cybermeters.com"

# Domain that receives inbound DMARC aggregate (RUA) reports by email. Customers
# add rua=mailto:<address_local>@<RUA_INBOUND_DOMAIN>. Use exact per-address Email
# Routing rules to this Worker's email() handler; never enable zone catch-all.
RUA_INBOUND_DOMAIN = "reports.cybermeters.com"

# Exact-route automation configuration (optional and non-blocking):
#   wrangler secret put CLOUDFLARE_API_TOKEN
#   wrangler secret put CLOUDFLARE_ZONE_ID
# The token requires Cloudflare Email Routing Rules Write on the zone. The API is
# zone-scoped, so CLOUDFLARE_ACCOUNT_ID is accepted by the Worker environment but
# is not required by this adapter. Optional worker override:
# CLOUDFLARE_EMAIL_ROUTING_WORKER_NAME = "cybermeters-platform"

# Manual-scan dispatch mode (PR-3A): "waituntil" = existing post-response
# ctx.waitUntil path (the default; any unrecognised value fails safe here);
# "queue" = durable Queue dispatch — PR-3B cutover only, founder-gated, and
# ONLY after both queues above exist in the account.
SCAN_DISPATCH_MODE = "queue"
SCAN_CAPACITY_MODE = "legacy"
SCAN_SUBREQUEST_LIMIT = 200

# Scheduled-scan dispatch mode (PR-B1A, 22 Jul 2026). Producer-side ONLY — the
# Queue consumer is shared with manual dispatch and is NOT flag-gated, so
# in-flight messages keep draining across any flag change. "waituntil" keeps
# the legacy cron direct-engine path byte-identical (any unrecognised value
# fails safe here); "queue" admits scheduled scans as 'queued' and dispatches
# via SCAN_QUEUE — PR-B1B cutover only, founder-gated, config-only flip.
# DELIBERATELY separate from SCAN_DISPATCH_MODE: coupling them would make a
# scheduled rollback also roll back the LIVE-ACCEPTED manual Queue path.
SCHEDULED_DISPATCH_MODE = "queue"

FRONTEND_URL = "https://app.cybermeters.com"
# Must match a redirect URI registered on the Entra app registration exactly.
# The canonical API host is used so the Microsoft consent screen shows
# api.cybermeters.com, never the workers.dev developer hostname.
MICROSOFT_REDIRECT_URI = "https://api.cybermeters.com/api/auth/microsoft/callback"

[[services]]
binding = "NETWORK_PROBE"
service = "cybermeters-network-probe"

# One private coordinator for the public provider's shared 1 request/second quota.
[[durable_objects.bindings]]
name = "LEAKCHECK_PUBLIC"
class_name = "LeakCheckPublic"

[[migrations]]
tag = "leakcheck-public-v1"
new_sqlite_classes = ["LeakCheckPublic"]
