name = "cybermeters-mcp-server"
main = "src/index.js"
compatibility_date = "2026-06-18"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = false
preview_urls = false

# Production host for the customer MCP endpoint and resource metadata.
# Customer access is on in production; set MCP_CUSTOMER_ENABLED = "false" to close it.
[[routes]]
pattern = "mcp.cybermeters.com"
custom_domain = true

[vars]
MCP_DEPLOYMENT_TIER = "production"
MCP_CUSTOMER_ENABLED = "true"

[observability]
enabled = true

[observability.traces]
enabled = true

# Customer abuse gate before OAuth validation or durable denial audit.
# Counters are per Cloudflare location and intentionally do not include bearer
# tokens, workspace IDs, or tool inputs. Missing bindings fail closed.
[[ratelimits]]
name = "MCP_EDGE_CLIENT_RATE"
namespace_id = "320031"
[ratelimits.simple]
limit = 120
period = 60

[[ratelimits]]
name = "MCP_EDGE_GLOBAL_RATE"
namespace_id = "320032"
[ratelimits.simple]
limit = 1000
period = 60

# Private RPC contracts. The named backend entrypoints are the only customer
# data path; the public host is closed whenever MCP_CUSTOMER_ENABLED=false.
[[services]]
binding = "MCP_BACKEND"
service = "cybermeters-platform"
entrypoint = "McpReadService"
remote = false

# OAuth and customer reads are also gated by the scan-api backend flags.
[[services]]
binding = "MCP_AUTH"
service = "cybermeters-platform"
entrypoint = "McpOAuthAuthorizationService"
remote = false

[[services]]
binding = "MCP_CUSTOMER_BACKEND"
service = "cybermeters-platform"
entrypoint = "McpCustomerReadService"
remote = false
