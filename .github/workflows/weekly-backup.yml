# Operational backup, not a CI runner. Enable only after the documented secret
# setup and confirmation of unused included Actions minutes/storage.
name: weekly-backup
on:
  schedule:
    - cron: '43 3 * * 0'
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: weekly-backup
  cancel-in-progress: false
jobs:
  backup:
    if: github.event.repository.private == true && github.ref == 'refs/heads/main' && vars.WEEKLY_BACKUP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require the reviewed immutable source commit
        env:
          BACKUP_SOURCE_REF: ${{ vars.BACKUP_SOURCE_REF }}
        run: '[[ "$BACKUP_SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: btncwn/CyberMeters-Platform
          ref: ${{ vars.BACKUP_SOURCE_REF }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Capture and encrypt weekly D1 export and R2 inventory
        env:
          CLOUDFLARE_BACKUP_TOKEN: ${{ secrets.CLOUDFLARE_BACKUP_TOKEN }}
          CM_WEEKLY_BACKUP_KEY: ${{ secrets.CM_WEEKLY_BACKUP_KEY }}
        run: node scripts/ops/weekly-backup.mjs capture "$RUNNER_TEMP/captured"
      - name: Store encrypted copy off-site
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: weekly-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/captured/weekly-backup.bin
          if-no-files-found: error
          retention-days: 21
          compression-level: 0
      - name: Download the durable off-site copy
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download "$GITHUB_RUN_ID" --name "weekly-backup-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --dir "$RUNNER_TEMP/verified"
      - name: Verify off-site readback before recording freshness
        env:
          CLOUDFLARE_BACKUP_TOKEN: ${{ secrets.CLOUDFLARE_BACKUP_TOKEN }}
          CM_WEEKLY_BACKUP_KEY: ${{ secrets.CM_WEEKLY_BACKUP_KEY }}
        run: node scripts/ops/weekly-backup.mjs record "$RUNNER_TEMP/verified" "$RUNNER_TEMP/captured"
