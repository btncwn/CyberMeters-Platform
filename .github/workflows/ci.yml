      - name: Validate Cyber Essentials data integrity (purge completeness + workspace-scoped evidence, mutation-tested)
        run: node scripts/validate-ce-data-integrity.js

      - name: Validate migrations (additive-only + fresh-apply convergence)
        run: node scripts/validate-migrations.js

      - name: Validate error contract (uniform { error, code, message }, no leak)
        run: node scripts/validate-error-contract.js

      - name: Validate ops-health monitoring (signals + thresholds + DB-down)
        run: node scripts/validate-ops-health.js

      - name: Validate maintenance mode (503 gate + health/ready exempt + bypass)
        run: node scripts/validate-maintenance-mode.js

      - name: Validate cron orchestration (dispatch + daily gates + isolation)
        run: node scripts/validate-cron.js

      - name: Validate email lifecycle (send/dedupe/retry + payment_failed exclusion)
        run: node scripts/validate-email-lifecycle.js

      - name: Validate weekly digest (active-only + dedup + all-quiet + windowing)
        run: node scripts/validate-weekly-digest.js

      - name: Validate weekly digest truth (semantic grouping + coverage-aware quiet state + workspace-scoped CTA + mutations)
        run: node scripts/validate-weekly-digest-truth.js

      - name: Validate pricing policy parity (locked ladder + fail-closed price mapping + checkout guard)
        run: node scripts/validate-pricing-policy-parity.js

      - name: Validate checkout consent + portal-only plan changes (B2 Terms/immediate-start waiver, B3 no second subscription)
        run: node scripts/validate-checkout-consent-portal.js

      - name: Validate billing lifecycle (entitlement state machine + grace window)
        run: node scripts/validate-billing-lifecycle.js

      - name: Validate Stripe events (per-event-type subscription state)
        run: node scripts/validate-stripe-events.js

      - name: Validate Q3 Stripe webhook idempotency (claim/complete/fail state machine + env + stale guard)
        run: node scripts/validate-q3-stripe-idempotency.js

      - name: Validate exposure timeline events (DNS-level asset changes)
        run: node scripts/validate-exposure-events.js

      - name: Validate Phase A Timeline Trust (comparability + flip-flop collapse + mutations)
        run: node scripts/validate-phase-a-timeline-trust.js

      - name: Validate posture timeline events (email-auth + exposed services)
        run: node scripts/validate-posture-events.js

      - name: Validate SPF static PASS-authorisation resolver (RFC 7208 limits / TempError fail-safe / CIDR containment / change detection)
        run: node scripts/validate-spf-resolver.js

      - name: Validate SPF CIDR customer-evidence fidelity mutations (display / RFC 5952 / prefix / cap / canonical form)
        run: node scripts/validate-spf-cidr-evidence-mutations.js

      - name: Validate SPF-RUA corroboration (observed-fail gate / containment / complete-only firm wording / dedupe)
        run: node scripts/validate-spf-corroboration.js

      - name: Validate posture-events false-resolution guard (exposed_service_resolved evidence gate)
        run: node scripts/validate-posture-events-resolution.js

      - name: Validate A1 email evidence-status honesty (unavailable SPF/DKIM never reads missing/clean + mutations)
        run: node scripts/validate-a1-email-evidence-status.js

      - name: Validate A2 identity evidence-status honesty (unavailable evidence never reads Low/clean + mutations)
        run: node scripts/validate-a2-identity-evidence-status.js

      - name: Validate A3 admin-surface evidence-status honesty (unavailable evidence never reads zero-exposure/healthy + mutations)
        run: node scripts/validate-a3-admin-evidence-status.js

      - name: Validate B workspace scorecard canonicalisation (absent evidence never presented as healthy + mutations)
        run: node scripts/validate-b-scorecard-canonical.js

      - name: Validate disappearance confirmation (asset/email/brand evidence gates + mutations)
        run: node scripts/validate-disappearance-confirmation.js

      # M6 Phase B1 — Deterministic Related Changes. Correlation ships a cluster ONLY
      # when a registered rule pairs >=2 INDEPENDENT signal families on the same
      # registrable domain in a bounded window; same domain + window alone is a
      # candidate, never a cluster. Drives the real adapter + rules + orchestrator
      # against schema.sql + every migration: proves the shadow-IT provenance guard,
      # the complete-evidence + adjacency floors, brand-alone-never-clusters,
      # append-only recurrence + idempotency, tenant isolation, append-only customer
      # feedback that a recurrence never resets, and manual-only case creation through
      # the canonical factory (no bypass).
      - name: Validate M6 B1 Related Changes (deterministic correlation / provenance / recurrence / isolation / manual case)
        run: node scripts/validate-m6-b1-related-changes.js

      - name: Validate exposure timeline feed (auth + filters + pagination)
        run: node scripts/validate-exposure-feed.js

      - name: Validate Certificates & Trust L2 (findings + honest unknowns)
        run: node scripts/validate-cert-trust-l2.js

      - name: Validate certificate standing-condition dedupe (occurrence identity — unchanged state never re-emits + mutations)
        run: node scripts/validate-cert-standing-condition-dedupe.js

      # Dependency-override governance. An `overrides` entry replaces a version a
      # dependency declared for itself — the canonical way to TAKE a security fix
      # upstream has not adopted, and a silent permanent fork if left unwatched.
      # Two frontend overrides (esbuild, test-exclude) were live with no record,
      # owner, review date or removal criterion at all. These guards bind every
      # live override to scripts/security/dependency-override-register.json and
      # fail closed on an unregistered override, a stale record, spec/version
      # drift, a dev-only claim the locked production graph contradicts, or an
      # elapsed review deadline. They run BEFORE the audits so a governance
      # failure is attributed to governance rather than to a raw advisory.
      - name: Validate dependency-override governance (register ⟷ manifest ⟷ lockfile, expiring + fail-closed)
        run: node scripts/validate-dependency-overrides.js

      - name: Validate dependency-override load-bearing mutations
        run: node scripts/validate-dependency-overrides-mutations.js

      - name: Audit worker dependencies
        working-directory: workers/scan-api
        run: npm audit --audit-level=high

      - name: Validate DMARCbis P1 protocol fixtures (pure injected DNS core)
        run: node scripts/validate-dmarcbis-p1.js

      - name: Validate DMARCbis P1 load-bearing mutations
        run: node scripts/validate-dmarcbis-p1-mutations.js

      - name: Validate DMARCbis P2 integration (budget / cache / lifecycle / aggregate compatibility)
        run: node scripts/validate-dmarcbis-p2.js

      - name: Validate DMARCbis P2 load-bearing mutations
        run: node scripts/validate-dmarcbis-p2-mutations.js

      - name: Validate DMARCbis P3 snapshot and additive API dual readers
        run: node scripts/validate-dmarcbis-p3.js

      - name: Validate DMARCbis P3 load-bearing mutations
        run: node scripts/validate-dmarcbis-p3-mutations.js

      - name: Validate DMARCbis P4 immutable lifecycle and Related Changes
        run: node scripts/validate-dmarcbis-p4.js

      - name: Validate DMARCbis P4 load-bearing mutations
        run: node scripts/validate-dmarcbis-p4-mutations.js

      - name: Validate DMARCbis P4 faithful runScanEngine lifecycle trace
        run: node scripts/validate-dmarcbis-p4-engine-trace.js

      - name: Validate DMARCbis P5 alerts, manual cases and DNS verification
        run: node scripts/validate-dmarcbis-p5.js

      - name: Validate DMARCbis P5 load-bearing mutations
        run: node scripts/validate-dmarcbis-p5-mutations.js

      - name: Validate DMARCbis P5/P6 faithful runScanEngine managed-lifecycle and customer-projection trace
        run: node scripts/validate-dmarcbis-p5-engine-trace.js

      - name: Validate DMARCbis P6 customer surfaces, Executive Report, PDF and historical parity
        run: node scripts/validate-dmarcbis-p6.js

      - name: Validate DMARCbis P6 load-bearing mutations
        run: node scripts/validate-dmarcbis-p6-mutations.js

      - name: Validate PDF DMARC record rendering (canonical value, never internal objects)
        run: node scripts/validate-pdf-dmarc-record-rendering.js

      - name: Validate PDF DMARC record rendering strict mutations
        run: node scripts/validate-pdf-dmarc-record-rendering-mutations.js

      - name: DMARCbis P1 tr46 Worker bundle gate (no Node compatibility flags)
        working-directory: workers/scan-api
        run: npx wrangler deploy --dry-run --config ../../scripts/fixtures/wrangler-dmarcbis-p1.toml

      - name: Worker bundle dry-run (Cloudflare packaging + import graph)
        working-directory: workers/scan-api
        run: npx wrangler deploy --dry-run

      - name: Email Worker bundle dry-run (standalone routed ingress)
        working-directory: workers/email-ingest
        run: npm run dry-run

      - name: Validate OpenAPI spec
        run: node scripts/validate-openapi.js

      - name: Validate CAPABILITIES.md drift
        run: node scripts/validate-capabilities-doc.js

      - name: Validate CE multidomain containment
        run: node scripts/validate-ce-multidomain-containment.js

      - name: Validate CE multidomain containment strict mutations
        run: node scripts/validate-ce-multidomain-containment-mutations.js

      # CT-R2 PR-1 — AST-backed, exhaustive scan_quality vocabulary inventory.
      # Counts use separate units (SQL predicate occurrences, SQL query sites,
      # source files, runtime semantic comparisons and governance comparisons).
      # The strict fresh-process suite rejects wrong-reason mutant kills.
      - name: Validate scan-quality vocabulary inventory (AST + SQL taxonomy)
        if: ${{ steps.ci_scope.outputs.decision != 'SAFE_DOCS_ONLY' }}
        run: node scripts/validate-scan-quality-vocabulary-inventory.js

      - name: Validate scan-quality vocabulary inventory strict mutations
        if: ${{ steps.ci_scope.outputs.decision != 'SAFE_DOCS_ONLY' }}
        run: node scripts/validate-scan-quality-vocabulary-mutations.js

      # Track A A2+A3 — ScanDetail must render frozen assessment rating/score only,
      # preserve canonical comparison-message priority, and require explicit
      # comparable=true for historical claims. The focused validator combines
      # TypeScript-AST guards with the real React fixture matrix; the mutation
      # runner serially edits/restores ScanDetail and pins exact kills.
      - name: Validate ScanDetail canonical band and historical comparison honesty
        run: node scripts/validate-scan-detail-presentation.js

      - name: Validate ScanDetail presentation strict mutations
        if: ${{ steps.ci_scope.outputs.decision != 'SAFE_DOCS_ONLY' }}
        run: node scripts/validate-scan-detail-presentation-mutations.js

      # TRACK-A3 — IntelligencePage consumes the same frozen assessment and
      # explicit comparability contract. The class guard inventories the full
      # local renderer/helper closure and mutation-proves raw scan aliases,
      # provisional-score preservation, backend reason priority and history.
      - name: Validate IntelligencePage canonical assessment and comparison honesty
        run: node scripts/validate-intelligence-page-presentation.js

      - name: Validate IntelligencePage presentation strict mutations
        if: ${{ steps.ci_scope.outputs.decision != 'SAFE_DOCS_ONLY' }}
        run: node scripts/validate-intelligence-page-presentation-mutations.js

      # A1 mutation proof includes a fresh-process real ScanDetail/Vitest carrier,
      # so it runs only after the pinned frontend dependency tree is installed.
      - name: Validate A1 report preparation load-bearing mutations
        run: node scripts/validate-report-preparing-mutations.js

      - name: Validate BRS downstream completeness load-bearing mutations
        run: node scripts/validate-brs-downstream-mutations.js

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Frontend type check (tsc — api contract + all .ts/.tsx)
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend component tests with coverage (Vitest)
        if: ${{ steps.ci_scope.outputs.decision != 'SAFE_DOCS_ONLY' }}
        working-directory: frontend
        run: npm run test:coverage

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # ── SBOM (CycloneDX) — supply-chain inventory for both workspaces ──────
      # node_modules for both are installed above, so the trees are accurate.
      # Uploaded as a build artifact per commit; committed snapshots in sbom/
      # are the point-in-time reference for the Trust Center.
      - name: Generate SBOMs (CycloneDX)
        run: |
          mkdir -p sbom
          ( cd workers/scan-api && npx --yes @cyclonedx/cyclonedx-npm@6.0.0 --ignore-npm-errors --output-format JSON --output-file ../../sbom/scan-api.cdx.json )
          ( cd frontend && npx --yes @cyclonedx/cyclonedx-npm@6.0.0 --ignore-npm-errors --output-format JSON --output-file ../sbom/frontend.cdx.json )
          node -e "for(const f of ['sbom/scan-api.cdx.json','sbom/frontend.cdx.json']){const d=require('./'+f);const n=(d.components||[]).length;console.log(f,n,'components, spec',d.specVersion);if(n===0)throw new Error('empty SBOM: '+f)}"

      - name: Validate license policy (no copyleft/unknown deps)
        run: node scripts/validate-licenses.js

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-cyclonedx
          path: sbom/*.cdx.json
          if-no-files-found: error

  # Static application security testing — runs independently of the main suite so
  # a security rule change surfaces on its own. Blocks the merge on any finding
  # (false positives are suppressed inline with a documented `nosemgrep`).
  sast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: pip install --quiet semgrep

      - name: Semgrep SAST (JS / security-audit / OWASP Top Ten)
        run: >
          semgrep scan
          --config p/javascript --config p/security-audit --config p/owasp-top-ten
          --exclude node_modules --exclude dist
          --metrics off --error
          workers/scan-api/src frontend/src scripts
