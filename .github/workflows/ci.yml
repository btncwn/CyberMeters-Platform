name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Show Node version
        run: node --version && npm --version

      - name: Secret scan (tracked files)
        run: |
          if git grep -nIE '(-----BEGIN [A-Z ]*PRIVATE KEY-----|AKIA[0-9A-Z]{16}|sk_live_[0-9a-zA-Z]{24})' -- ':!.github/**' ':!*.md'; then
            echo "::error::Potential secret found in tracked files — remove it and rotate the credential"
            exit 1
          fi
          echo "No obvious secrets in tracked files."

      - name: Worker syntax check
        run: node --check workers/scan-api/src/index.js

      - name: Validate scanner regression fixtures
        run: node scripts/validate-regression-fixtures.js

      - name: Validate security contracts (auth / MFA / RBAC / billing)
        run: node scripts/validate-security-contracts.js

      - name: Validate integration flows (tenant isolation / access control)
        run: node scripts/validate-integration.js

      - name: Validate tenant-isolation matrix (cross-tenant read/write/delete/oracle)
        run: node scripts/validate-tenant-isolation.js

      - name: Validate DMARC XML safety (XXE / entity-expansion / size DoS)
        run: node scripts/validate-dmarc-xml-safety.js

      - name: Validate SSRF domain guard (IP/localhost/metadata/reserved-TLD reject)
        run: node scripts/validate-ssrf-domain-guard.js

      - name: Validate MSP portfolio (cross-MSP isolation + change counts + exec summary)
        run: node scripts/validate-portfolio.js

      - name: Validate identity exposure (login surfaces + impersonation + spoofing + isolation)
        run: node scripts/validate-identity-exposure.js

      - name: Validate report branding (white-label gating + PDF wordmark + isolation)
        run: node scripts/validate-report-branding.js

      - name: Validate hosted DNS v2 migration (backfill 1:1 + no-CHECK + idempotent)
        run: node scripts/validate-hosted-dns-v2.js

      - name: Validate hosted TLS-RPT (create/verify/delete + coexistence + isolation)
        run: node scripts/validate-hosted-tls-rpt.js

      - name: Validate hosted MTA-STS (TXT delegation + HTTPS policy guidance)
        run: node scripts/validate-hosted-mta-sts.js

      - name: Validate TLS-RPT ingestion (parse + inbound routing + dedup + isolation)
        run: node scripts/validate-tlsrpt-ingest.js

      - name: Validate DMARC sender classification (auto evidence + manual override)
        run: node scripts/validate-sender-classification.js

      - name: Validate DMARC impact forecast (legitimate-vs-risky + rollback assessment)
        run: node scripts/validate-dmarc-impact.js

      - name: Validate request pipeline (fetch → auth → RBAC → DB; login + webhook)
        run: node scripts/validate-pipeline.js

      - name: Validate email worker equivalence (golden vs api worker)
        run: node scripts/validate-email-worker.js

      - name: Validate log redaction (secrets never reach logs)
        run: node scripts/validate-log-redaction.js

      - name: Validate purge completeness (no orphaned tenant rows / R2 objects)
        run: node scripts/validate-purge-completeness.js

      - name: Validate migrations (additive-only + fresh-apply convergence)
        run: node scripts/validate-migrations.js

      - name: Validate error contract (uniform { error, code, message }, no leak)
        run: node scripts/validate-error-contract.js

      - name: Validate ops-health monitoring (signals + thresholds + DB-down)
        run: node scripts/validate-ops-health.js

      - name: Validate maintenance mode (503 gate + health/ready exempt + bypass)
        run: node scripts/validate-maintenance-mode.js

      - name: Validate cron orchestration (dispatch + daily gates + isolation)
        run: node scripts/validate-cron.js

      - name: Validate email lifecycle (send/dedupe/retry + payment_failed exclusion)
        run: node scripts/validate-email-lifecycle.js

      - name: Validate weekly digest (active-only + dedup + all-quiet + windowing)
        run: node scripts/validate-weekly-digest.js

      - name: Validate billing lifecycle (entitlement state machine + grace window)
        run: node scripts/validate-billing-lifecycle.js

      - name: Validate Stripe events (per-event-type subscription state)
        run: node scripts/validate-stripe-events.js

      - name: Validate exposure timeline events (DNS-level asset changes)
        run: node scripts/validate-exposure-events.js

      - name: Validate posture timeline events (email-auth + exposed services)
        run: node scripts/validate-posture-events.js

      - name: Validate exposure timeline feed (auth + filters + pagination)
        run: node scripts/validate-exposure-feed.js

      - name: Install worker deps
        working-directory: workers/scan-api
        run: npm ci || npm install

      - name: Audit worker dependencies
        working-directory: workers/scan-api
        run: npm audit --audit-level=high

      - name: Worker bundle dry-run (Cloudflare packaging + import graph)
        working-directory: workers/scan-api
        run: npx wrangler deploy --dry-run

      - name: Validate OpenAPI spec
        run: node scripts/validate-openapi.js

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Frontend type check (tsc — api contract + all .ts/.tsx)
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend component tests with coverage (Vitest)
        working-directory: frontend
        run: npm run test:coverage

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # ── SBOM (CycloneDX) — supply-chain inventory for both workspaces ──────
      # node_modules for both are installed above, so the trees are accurate.
      # Uploaded as a build artifact per commit; committed snapshots in sbom/
      # are the point-in-time reference for the Trust Center.
      - name: Generate SBOMs (CycloneDX)
        run: |
          mkdir -p sbom
          ( cd workers/scan-api && npx --yes @cyclonedx/cyclonedx-npm@6.0.0 --ignore-npm-errors --output-format JSON --output-file ../../sbom/scan-api.cdx.json )
          ( cd frontend && npx --yes @cyclonedx/cyclonedx-npm@6.0.0 --ignore-npm-errors --output-format JSON --output-file ../sbom/frontend.cdx.json )
          node -e "for(const f of ['sbom/scan-api.cdx.json','sbom/frontend.cdx.json']){const d=require('./'+f);const n=(d.components||[]).length;console.log(f,n,'components, spec',d.specVersion);if(n===0)throw new Error('empty SBOM: '+f)}"

      - name: Validate license policy (no copyleft/unknown deps)
        run: node scripts/validate-licenses.js

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-cyclonedx
          path: sbom/*.cdx.json
          if-no-files-found: error

  # Static application security testing — runs independently of the main suite so
  # a security rule change surfaces on its own. Blocks the merge on any finding
  # (false positives are suppressed inline with a documented `nosemgrep`).
  sast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: pip install --quiet semgrep

      - name: Semgrep SAST (JS / security-audit / OWASP Top Ten)
        run: >
          semgrep scan
          --config p/javascript --config p/security-audit --config p/owasp-top-ten
          --exclude node_modules --exclude dist
          --metrics off --error
          workers/scan-api/src frontend/src scripts
