name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel a superseded run when new commits are pushed to the SAME pull request,
# so a rapid re-push does not pay for stale in-progress runs. Never cancel a
# main-branch run: every merged commit is fully validated. Zero coverage change.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # The fail-closed PR classifier requires the exact event base/head and
          # merge-base. A shallow checkout is never treated as a safe diff.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          # Restore the npm download cache keyed on both lockfiles so `npm ci`
          # does not re-download every run. No coverage change; save wall-clock
          # and paid minutes on every run.
          cache: 'npm'
          cache-dependency-path: |
            workers/scan-api/package-lock.json
            frontend/package-lock.json

      - name: Classify CI change scope (fail closed)
        id: ci_scope
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_EVENT_PATH: ${{ github.event_path }}
        run: |
          # Defaults are written first. GitHub uses the final value for duplicate
          # output keys, so a successful classifier may narrow the run; a syntax,
          # load, git or payload failure leaves RUN-ALL in force.
          {
            echo "decision=UNKNOWN_FAIL_CLOSED"
            echo "effective_mode=RUN_ALL"
            echo "safe_docs_only=false"
            echo "expected_net_savings_seconds=0"
          } >> "$GITHUB_OUTPUT"
          if ! node scripts/classify-ci-change.js \
            --event-name "$CI_EVENT_NAME" \
            --event-file "$CI_EVENT_PATH"; then
            echo "::warning::CI scope classifier failed unexpectedly; RUN-ALL defaults remain active"
            # Reassert after any late process failure. The classifier writes its
            # safe outputs last, but this second default also closes stdout,
            # summary or future post-output failure paths.
            {
              echo "decision=UNKNOWN_FAIL_CLOSED"
              echo "effective_mode=RUN_ALL"
              echo "safe_docs_only=false"
              echo "expected_net_savings_seconds=0"
            } >> "$GITHUB_OUTPUT"
            {
              echo "## CI scope classification"
              echo
              echo "- Decision: **UNKNOWN_FAIL_CLOSED**"
              echo "- Effective mode: **RUN_ALL**"
              echo "- Reason: classifier process failed; fail-closed defaults retained"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Show Node version
        run: node --version && npm --version

      # Runtime validators import the production scan-engine graph. DMARCbis P2
      # makes that graph reach the pinned tr46 dependency, so install Worker
      # dependencies before the first validator rather than only before bundling.
      - name: Install worker deps
        working-directory: workers/scan-api
        run: npm ci || npm install

      # The CT consumer-inventory oracle parses frontend source through its own
      # exact-pinned @babel/parser dependency. Install the committed frontend
      # graph before any validator can load that oracle; the later build/test
      # steps reuse this one deterministic install.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Secret scan (tracked files)
        run: |
          if git grep -nIE '(-----BEGIN [A-Z ]*PRIVATE KEY-----|AKIA[0-9A-Z]{16}|sk_live_[0-9a-zA-Z]{24})' -- ':!.github/**' ':!*.md'; then
            echo "::error::Potential secret found in tracked files — remove it and rotate the credential"
            exit 1
          fi
          echo "No obvious secrets in tracked files."

      - name: Validate safe docs-only CI classifier and conditional-step governance
        run: node scripts/validate-ci-safe-docs-only.js

      - name: Worker syntax checks (API + standalone email ingress)
        run: |
          node --check workers/scan-api/src/index.js
          node --check workers/email-ingest/src/index.js

      - name: Validate scanner regression fixtures
        run: node scripts/validate-regression-fixtures.js

      - name: Validate provider-infra classification (edge/CDN tech ≠ provider ownership)
        run: node scripts/validate-provider-classification.js

      - name: Validate security contracts (auth / MFA / RBAC / billing)
        run: node scripts/validate-security-contracts.js

      - name: Validate integration flows (tenant isolation / access control)
        run: node scripts/validate-integration.js

      - name: Validate tenant-isolation matrix (cross-tenant read/write/delete/oracle)
        run: node scripts/validate-tenant-isolation.js

      - name: Full-repo assurance — entry-point inventory (drift + auth-coverage gate)
        run: node scripts/validate-entry-point-inventory.js

      - name: Full-repo assurance — tenant-isolation invariant matrix (table classification + harness cross-ref)
        run: node scripts/validate-tenant-isolation-matrix.js

      - name: Full-repo assurance — static tenant-query audit (workspace-domain / hostname-only / global-latest / R2-key / body-trust)
        run: node scripts/validate-tenant-query-audit.js

      - name: Full-repo assurance — workspace-domain tenant-scope mutation proof
        run: node scripts/validate-tenant-scope-assurance-mutations.js

      - name: Full-repo assurance — extended two-tenant harness (same-hostname / removed-member / identity)
        run: node scripts/validate-tenant-isolation-extended.js

      - name: Full-repo assurance — property-based authorization suite (deterministic seed)
        run: node scripts/validate-authz-properties.js

      - name: Full-repo assurance — cross-tenant authz coverage (C1 smuggle / C2 role / C4 R2 / C5 token)
        run: node scripts/validate-tenant-authz-coverage.js

      - name: A6 viewer-role enforcement (Related Changes — read-allowed / all mutations refused / honest can_manage)
        run: node scripts/validate-a6-viewer-enforcement.js

      - name: Full-repo assurance — billing/entitlement abuse coverage (D1 downgrade / D2 trial / D3 replay / D4 checkout)
        run: node scripts/validate-billing-abuse-coverage.js

      - name: Full-repo assurance — workflow abuse coverage (F2 verification / F3 alert+digest / F4 rate-limit)
        run: node scripts/validate-workflow-abuse-coverage.js

      - name: Full-repo assurance — authentication coverage (B2 session / B3 invalidation / B4 MFA / B5 SSO claims / B6 reset)
        run: node scripts/validate-auth-coverage.js

      - name: Full-repo assurance — injection coverage (E2 render-sink escaping / E4 mass-assignment)
        run: node scripts/validate-injection-coverage.js

      - name: DOM-XSS sink source-guard (no raw-HTML sink in frontend/src + alert-link sanitiser present)
        run: node scripts/validate-dom-xss-sinks.js

      - name: Full-repo assurance — production integrity runbook SQL (executable check)
        run: node scripts/validate-production-integrity-sql.js

      - name: Validate workspace integrity (own-retained scan count / owner-only soft-delete)
        run: node scripts/validate-workspace-integrity.js

      - name: Validate DMARC XML safety (XXE / entity-expansion / size DoS)
        run: node scripts/validate-dmarc-xml-safety.js

      - name: Validate SSRF domain guard (IP/localhost/metadata/reserved-TLD reject)
        run: node scripts/validate-ssrf-domain-guard.js

      - name: Validate SSRF scan guard (redirect-time + resolved-IP block in safeFetch)
        run: node scripts/validate-ssrf-scan-guard.js

      - name: Validate security-headers binding (extracted module runtime ref + graceful fail)
        run: node scripts/validate-security-headers-binding.js

      - name: Validate scan subrequest budget (counter + dynamic cap + CT-state ledgers)
        run: node scripts/validate-scan-subrequest-budget.js

      - name: Validate scan-engine subrequest counter (faithful engine run, mocked fetch/D1/R2)
        run: node scripts/validate-scan-engine-counter.js

      - name: Validate reserved-mode scan (exposure-first + budget-gated modules)
        run: node scripts/validate-reserved-scan.js

      - name: Validate scan-engine hard-50 (reserved reaches exposure within a 50 ceiling)
        run: node scripts/validate-scan-engine-hard50.js

      - name: Validate reserved prober SSRF (per-hop revalidation + rebinding + redirect matrix)
        run: node scripts/validate-reserved-probe-ssrf.js

      - name: Validate C1 default-prober redirect SSRF (bounded manual redirects + per-hop guard + fail-closed)
        run: node scripts/validate-c1-redirect-ssrf.js

      - name: Validate SSO nOAuth guard (single-tenant tid enforcement + email-link gate)
        run: node scripts/validate-sso-linking-guard.js

      - name: Validate auth/session hardening (SSO MFA gate, reset token revocation, invite + lifecycle deleted_at)
        run: node scripts/validate-auth-session-hardening.js

      - name: B5 OAuth callback readiness (state CSRF single-use/TTL, config/error gates, OTC single-use, nonce binding)
        run: node scripts/validate-oauth-callback-readiness.js

      # Workspace invitations must actually be delivered: the POST handler dispatches the
      # email through the canonical sendCustomerEmail path, fails CLOSED on a send failure
      # (compensating-delete + generic non-2xx), records the created audit only on a real
      # handoff, and never leaks the raw token. Self-proving (mutation-tested).
      - name: Validate workspace invitation email delivery (send-before-201 / fail-closed / no token leak)
        run: node scripts/validate-workspace-invitation-email.js

      - name: Validate MSP portfolio (cross-MSP isolation + change counts + exec summary)
        run: node scripts/validate-portfolio.js

      # MSP Portfolio Per-Domain State and Trend. The portfolio decides who an MSP helps
      # FIRST, so absent evidence is more dangerous here than anywhere else: a domain
      # nobody scanned must never sort below one verified healthy, a rule that stopped
      # running must never read as a fix, and a resolver change must never read as every
      # customer deteriorating on deploy day. Mutation-proved 18x.
      - name: Validate MSP portfolio per-domain state + trend (isolation / same-hostname / green-by-absence / resolver-version gate / append-only / no alert engine)
        run: node scripts/validate-msp-portfolio-domains.js

      - name: Validate executive-report scoping (latest-scan findings/recs, no historical pile-up)
        run: node scripts/validate-report-findings-scoping.js

      - name: Validate identity exposure (login surfaces + impersonation + spoofing + isolation)
        run: node scripts/validate-identity-exposure.js

      - name: Validate report branding (white-label gating + PDF wordmark + isolation)
        run: node scripts/validate-report-branding.js

      - name: Validate report branding v2 (precedence / entitlement / tenant isolation / logo validation / freeze integrity)
        run: node scripts/validate-report-branding-v2.js

      - name: Validate report content depth + branding (eight-domain richness / co-brand / white-label / logo routes / mutation)
        run: node scripts/validate-report-content-branding.js

      # A5 Executive Security Report PDF quality: evidence-honest risk narrative (no unqualified
      # "no major gaps" under incomplete coverage), limitation blocks never split across a page,
      # branded cover, internal version identifiers removed from the visible body, eight domains +
      # provisional wording preserved. Renders the real PDF and asserts the bytes.
      - name: Validate A5 executive report PDF (evidence-honest narrative / page breaks / branding / no version noise)
        run: node scripts/validate-a5-executive-report.js

      - name: Validate hosted DNS v2 migration (backfill 1:1 + no-CHECK + idempotent)
        run: node scripts/validate-hosted-dns-v2.js

      - name: Validate Email Protection canonical lifecycle (windowed evidence / baseline / recovery / re-entry)
        run: node scripts/validate-alert-b3-email-protection.js

      - name: Validate Email Protection alert honesty (no posture alerts / no cumulative thresholds / no invented claims)
        run: node scripts/validate-alert-b3-email-honesty.js

      # Migrations 088/089/090 each shipped a lifecycle that WRITES records and ALERTS on
      # them with no way for a customer to read them. Drives the real Worker: a route that
      # is unmounted, unscoped, unbounded or that leaks an internal field fails here.
      - name: Validate M5 read surfaces (mig 088/089/090 — tenancy, pagination, evidence honesty)
        run: node scripts/validate-m5-read-surfaces.js

      # M5.a Email Protection vertical: creation + linkage + ownership + verification +
      # recurrence. The boundary it defends: a customer's assertion cannot conclude
      # verification for anything CyberMeters can observe itself. Mutation-tested.
      - name: Validate M5.a Email Protection managed cases (creation/linkage/ownership/verification/recurrence)
        run: node scripts/validate-m5a-email-cases.js

      # M5.a Website Security vertical, plus the cross-domain verification vocabulary and
      # the resolver-misuse guard. Two boundaries: absence is a fix ONLY when the detecting
      # module provably ran (the #105 class), and "Verified"/"Confirmed" belong to what
      # CyberMeters observed — never to a customer's attestation. Mutation-tested.
      - name: Validate M5.a Website Security managed cases + verification vocabulary
        run: node scripts/validate-m5a-website-cases.js

      # M5.a Cyber Essentials vertical — the final one. Drives the REAL evaluator end to end.
      # The boundary: a CE control CyberMeters cannot externally observe must never be
      # presented as externally verified, and what it CAN see is only ever a partial slice.
      # Mutation-tested, including the approved-guard P1 and the #106 purge defect.
      - name: Validate M5.a Cyber Essentials managed cases (final M5.a vertical)
        if: ${{ steps.ci_scope.outputs.decision != 'SAFE_DOCS_ONLY' }}
        run: node scripts/validate-m5a-ce-cases.js

      # CE readiness honesty. access_control and malware_protection declare
      # external_coverage: none, and were scored/banded/flagged externally_assessed from
      # SPF/DKIM/DMARC — email authentication is not evidence of user access control, and not
      # evidence of endpoint malware protection. Mutation-tested end to end (builder, PDF,
      # frontend) plus the arithmetic denominator.
      - name: Validate Cyber Essentials readiness honesty (no proxy scoring)
        run: node scripts/validate-ce-readiness-honesty.js

      # CE questionnaire hygiene. The public self-check and the authenticated set were two
      # independently-maintained copies and had drifted: 14 of 20 questions carried a
      # different KEY on each side, and 4 of the 6 shared keys were worded differently. Both
      # now consume one build-time module. question_key is PERSISTED, so a rename orphans
      # stored answers; wording changes require a version bump (fingerprint-pinned).
      - name: Validate CE questionnaire drift, versioning and scope
        run: node scripts/validate-ce-question-drift.js

      # CE answer re-versioning contract + question-set version FORMAT. The client submits the
      # FULL questionnaire on every save, so an unconditional re-stamp silently relabels
      # untouched historical answers as answers to reworded questions the customer never saw.
      # Enforced in SQL against the REAL route (a crafted client must not bypass it), and the
      # version format is pinned to ISO 8601 YYYY-MM-DD. Mutation-tested.
      - name: Validate CE answer re-versioning contract + version format
        run: node scripts/validate-ce-answer-versioning.js

      # M5.b — Certificates & Trust verification reconciliation. certificate_case carried a
      # blanket `manual` across a domain holding SIX verification methods, so a customer could
      # attest an EXPIRED certificate verified, and could attest a CT blackout resolved even
      # though the registry says nothing can verify it. Support is now derived per finding and
      # the honest system verifier closes the case from CyberMeters' own re-observation.
      - name: Validate M5.b Certificates verification reconciliation
        run: node scripts/validate-m5b-certificate-verification.js

      # M5.b remaining reconciliation. D1: patch_management_readiness was scored from
      # certificate expiry / cert risk / ASM backlog / asset events — none of which measures
      # any question it asks; the indicator is now 2 of 5 and methodology-versioned so a
      # denominator change cannot read as a posture change. D2: `external` is not `automated`
      # (a third party certifies, not our scan). D3: ASM/Brand blanket drift is CI-blocked.
      - name: Validate M5.b remaining reconciliation (CE patch readiness, external, blankets)
        if: ${{ steps.ci_scope.outputs.decision != 'SAFE_DOCS_ONLY' }}
        run: node scripts/validate-m5b-remaining-reconciliation.js

      # M5.c — canonical reporting snapshot (mig 093). Five render paths with three
      # calculation brains could show different score/risk/state/remediation truth to the
      # same customer, and every one recalculated history on read. One completed Cyber MOT
      # now produces ONE immutable eight-domain snapshot (R2 JSON + D1 index): built once
      # (081 claim), completed only over a durable R2 object, never overwritten, superseded
      # append-only, methodology-stamped so a methodology change can never read as posture
      # movement. Mutation-tested: 13 defects incl. a ninth domain, five-pillar revival,
      # answers→score leakage, attestation relabelled Verified, and purge dropping R2.
      - name: Validate M5.c canonical reporting snapshot (immutability / idempotency / honesty / purge)
        run: node scripts/validate-m5c-reporting-snapshot.js

      # M5.d — renderer migration. Every customer report renderer (scan report JSON,
      # scan PDF, executive report v3, workspace executive PDF) renders the canonical
      # immutable snapshot: score/band/BRI identical across surfaces by construction,
      # live-table changes cannot rewrite rendered history, five-pillar and Vendor
      # Risk/Supply Chain output cannot return, unknown snapshot schema versions fail
      # closed, and pre-093 scans reconstruct through the ONE canonical builder under
      # the founder's strict reconstruction policy (no current case/CE state injected).
      # Mutation-tested: 11 defects incl. a renderer re-deriving score, taxonomy
      # collapse, reconstruction injecting live state, and render-time clock leakage.
      - name: Validate M5.d renderer migration (snapshot-native renderers / reconstruction / parity)
        run: node scripts/validate-m5d-renderer-migration.js

      # A1 — completed scan lifecycle is separate from canonical report
      # availability. Real route/resolver fixtures pin the finite preparation
      # window, terminal errors, tenant/soft-delete boundaries and frontend
      # polling bound; strict fresh-process carrier mutants prevent regression.
      - name: Validate A1 report preparation availability (routes / tenancy / finite polling)
        run: node scripts/validate-report-preparing.js

      # M5.e-A — band-ladder contract. The Cyber Metrics Score has ONE canonical band
      # partition (CYBER_METRICS_SCORE_BANDS); the frontend carries a value-identical
      # mirror (no cross-build import — this validator IS the coupling), absent scores
      # have no band, unknown bands render neutral, and no undocumented inline score
      # ladder may appear in backend engines/routes. Mutation-tested: threshold change
      # on either side, mirror desync, and unknown→healthy all fail.
      - name: Validate band-ladder contract (canonical bands / frontend mirror / no drift)
        run: node scripts/validate-band-ladder-contract.js

      # M5.e-E — closure gate. Proves the M5.e-A/B/C/D fixes are still coherent as
      # one release: eight-domain completeness, score/band parity, state honesty,
      # ownership assignment, persisted Business Risk, MSP parity, frontend parity,
      # migration 094 compatibility, and the founder-required mutation set.
      - name: Validate M5.e closure (eight-domain parity closure and release gate)
        run: node scripts/validate-m5e-closure.js

      # Customer-facing Business Risk must be based on the exact latest complete
      # assessment. Partial evidence cannot overwrite the canonical row, append a
      # numeric trend point, or make an older score look current. The first validator
      # covers producer/projection/consumer/report parity, the second drives the real
      # runScanEngine complete→partial path and authenticated route, and the third
      # proves all seven founder-required regressions remain load-bearing.
      - name: Validate BRS partial-scan honesty (persistence / projection / consumer parity)
        run: node scripts/validate-brs-partial-scan-honesty.js

      - name: Validate BRS real complete-to-partial engine and customer-route trace
        run: node scripts/validate-brs-partial-scan-engine-trace.js

      - name: Validate BRS partial-scan honesty load-bearing mutations
        run: node scripts/validate-brs-partial-scan-mutations.js

      - name: Validate BRS downstream completeness (sibling evidence + real customer route)
        run: node scripts/validate-brs-downstream-completeness.js

      - name: Validate BRS reconciliation inventory parity with the runtime resolver
        run: node scripts/validate-brs-reconciliation-runbook.js

      # M5.f — canonical per-workspace eight-domain maturity ledger. Maturity is decided
      # deterministically by the backend engine (never the frontend) from the resolver's
      # domain STATE + the managed-case lifecycle + the registry's verification CAPABILITY.
      # Missing/failed/partial/unavailable evidence never becomes mature; a partial scan
      # writes nothing; customer attestation and approved inventory alone never reach
      # verified; the ledger is append-only, idempotent, tenant-isolated and read-pure; a
      # query failure surfaces unavailable, never a clean/healthy zero. Mutation-tested:
      # 10 defects incl. a dropped domain, reordered ladder, unavailable→mature, partial
      # advancement, dropped workspace filter, write-on-read, attestation→verified,
      # frontend-derived stage, history overwrite, and failure→healthy.
      - name: Validate M5.f maturity ledger (deterministic / honest / append-only / read-pure)
        run: node scripts/validate-m5f-maturity-ledger.js

      # M5.g — Final CI closure for the eight-domain M5 episode. Gate-level guard that the
      # WHOLE M5 validator suite (read-surfaces, m5a×3, m5b×2, m5c, m5d, m5e, m5f) plus
      # ci-governance and this closure itself stay wired in ci.yml — so no M5 coverage can
      # silently rot — and that the three per-scan append-only tables (091 states, 093
      # snapshot, 095 maturity) keep their idempotency UNIQUE and INSERT OR IGNORE and are
      # never overwritten in place. Static, deterministic, no runtime change. Mutation-tested.
      - name: Validate M5 closure (full M5 gate wired + append-only idempotency locked)
        run: node scripts/validate-m5-closure.js

      # Mutation proof for the 2026-07-16 alerting repair. Two guards in this repo were
      # named for coverage they never executed, so the suites above are themselves proved
      # load-bearing here: each defect is reintroduced and must reappear.
      - name: Validate alerting-repair mutations (threat suppression / recovery closure / dedupe / tenant scope / no bypass)
        run: node scripts/validate-alerting-repair-mutations.js

      - name: Validate tenant alert recipients (no operator fallback / verified-only / soft-delete)
        run: node scripts/validate-alert-recipients.js

      - name: Validate canonical managed-alert pipeline (entitlement / preferences / dedupe / ledger)
        run: node scripts/validate-managed-alerts.js

      - name: Validate alert truth & field mapping (workspace name + entity typing + what-changed ≠ recommendation + evidence + CTA + mutations)
        run: node scripts/validate-alert-truth-mapping.js

      - name: Validate customer alert evidence fidelity (HTTPS uncertainty + positive controls + CE labels + fresh-process mutations)
        run: node scripts/validate-customer-alert-evidence-fidelity.js

      - name: Validate first-ever alert activation grace (2s lazy-activation clock-skew + backlog guard + mutations)
        run: node scripts/validate-alert-activation-grace.js

      - name: Validate interrupted-scan terminal recovery (canonical cron repair + read-only GETs + race/idempotency/terminal-report guards)
        run: node scripts/validate-interrupted-scan-recovery.js

      - name: Validate atomic active-scan admission guard (mig 099 partial unique indexes + domain-aliasing + NULL-ws defense + honest 409 + drift + mutations)
        run: node scripts/validate-scan-admission-guard.js

      - name: Validate durable scan Queue dispatch (PR-3A flag-off parity + claim CAS + at-least-once no-ops + dispatch compensation + recovery widening + config invariants + mutations)
        run: node scripts/validate-scan-queue-dispatch.js

      - name: Validate scheduled durable Queue dispatch (PR-B1A flag-off parity + queued admission ordering + single stamp + stamp/dispatch compensation + settlement hook + advisory origin + config pin + mutations)
        run: node scripts/validate-scheduled-queue-dispatch.js

      - name: Validate Shadow IT recurrence truth (per-recurrence copy + observed ≠ unauthorised + surface parity + viewer gating + dedupe + mutations)
        run: node scripts/validate-shadow-it-recurrence-truth.js

      - name: Validate alert trust foundation (free-plan blocked on every path / per-user preferences / no legacy bypass)
        run: node scripts/validate-alert-trust-foundation.js

      - name: Validate canonical managed-case alerts (Brand + ASM occurrence / watermark / namespaced severity)
        run: node scripts/validate-alert-b1-canonical-cases.js

      - name: Validate unattributable-claim email suppression (new_vendor / supply_chain_risk_increase)
        run: node scripts/validate-alert-b4a-suppression.js

      # B4b finishes the legacy engine: suppression is now EXHAUSTIVE over every type
      # the legacy processor can raise (the gate is opt-in, so an unlisted type would
      # silently send — the suite extracts the types from the source rather than
      # trusting a list), the advisory read-then-write dedupe is gone, and the two
      # dead tenant senders that fell back to the OPERATOR's inbox are deleted.
      # Mutation-tested: it empties the policy set and asserts the legacy path emails
      # the customer again, so "nothing was sent" is a proven result, not an artefact.
      - name: Validate B4b legacy alert cleanup (exhaustive suppression / no advisory dedupe / no ungated sender, mutation-tested)
        run: node scripts/validate-alert-b4b-legacy-cleanup.js

      - name: Validate certificate expiry bands (canonical renewal_overdue escalation / no legacy cert_expiry)
        run: node scripts/validate-alert-b2-cert-expiry-bands.js

      # The watermark compares an ISO-UTC activated_at against a timezone-implicit
      # SQLite created_at. Date.parse reads the second as LOCAL time, so the old
      # comparison was correct ONLY on a UTC runner — i.e. green here and wrong
      # everywhere else. Re-run the suite under non-UTC zones (including a
      # half-hour offset) so that class of bug can never pass CI again.
      - name: Validate alert watermark is timezone-independent (non-UTC runners)
        run: |
          for tz in Europe/London America/Los_Angeles Asia/Kolkata; do
            echo "── TZ=$tz ──"
            TZ=$tz node scripts/validate-alert-b1-canonical-cases.js
          done

      - name: Validate alert occurrence identity (append-only event = condition start)
        run: node scripts/validate-alert-occurrence.js

      # created_at is second-precision, so two appends for one record inside one
      # second tie and fall through to the tie-break. On a random-id tie-break the
      # resolver can return the OLDER event, whose dedupe key already exists — so a
      # real alert is swallowed as a duplicate. Fail-SILENT, and shared by all six
      # domains. This suite mutation-tests the rowid tie-break: it reverts the fix
      # in memory and asserts the defect reproduces, so a green run means the suite
      # can actually catch the regression rather than merely agreeing with the code.
      - name: Validate alert occurrence ordering (same-second tie-break = insertion order, mutation-tested)
        run: node scripts/validate-alert-occurrence-ordering.js

      # Website Security is the 7th canonical alerting domain. Its events table is
      # BRAND NEW, so alert_activation's baseline_count is 0 for every workspace and
      # emitManagedAlert's firstEverCondition hatch would make an entire pre-existing
      # backlog look "genuinely new by construction" — the per-domain baseline marker
      # is the only thing stopping a tenant-wide false-alert incident on deploy day.
      # Mutation-tested on both load-bearing guards: removing the flood guard alerts
