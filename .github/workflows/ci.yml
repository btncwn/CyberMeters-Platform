name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Node version
        run: node --version && npm --version

      - name: Worker syntax check
        run: node --check workers/scan-api/src/index.js

      - name: Validate scanner regression fixtures
        run: node scripts/validate-regression-fixtures.js

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
